[project]
name = "artisan-hamid-h7"
version = "0.1.0"
description = "WebSocket-to-BLE bridge connecting Artisan to Hamid H7/H7s coffee roasters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak==1.0.1",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyrefly>=0.22.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["main.py", "src", "tests"]
search-path = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]
